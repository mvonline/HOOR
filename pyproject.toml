[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rade-hoor-studio"
version = "0.1.0"
description = "AI-native multi-agent game studio for Rad-e Hoor"
readme = "masterPrompt.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "pydantic-settings>=2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "sqlalchemy>=2",
  "python-frontmatter>=1.1",
  "markdown-it-py>=3",
  "streamlit>=1.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
studio = "studio.cli:main"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
